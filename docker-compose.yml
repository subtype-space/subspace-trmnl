services:
  subspace-trmnl:
    init: true
    build: ./
    image: ghcr.io/subtype-space/subspace-trmnl:latest
    container_name: subspace-trmnl
    restart: always
    ports:
      - 9595:9595
    env_file: .env
    # healthcheck can be too chatty in logs
    # healthcheck:
    #   test: ["CMD", "node", "-e", "fetch('http://localhost:9595/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
    #   interval: 30s
    #   timeout: 5s
    #   start_period: 10s
    #   retries: 3
    # For Prod, do not modify this env var unless you REALLLY need to
    environment:
      TRMNL_DB_PATH: /opt/api/subspace-db/trmnl.sqlite
    # Ensure ./data exists 
    volumes:
      - ./data:/opt/api/subspace-db
    networks:
      - proxy
      - api
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.subspace-trmnl.rule=Host(`trmnl.subtype.space`)'
      - 'traefik.http.routers.subspace-trmnl.entrypoints=websecure'
      - 'traefik.http.routers.subspace-trmnl.tls=true'
      - 'traefik.http.routers.subspace-trmnl.tls.certresolver=cloudflare'
      - 'traefik.docker.network=proxy'
      - 'traefik.http.routers.subspace-trmnl.middlewares=secureHeaders@file, generic-csp@file'

volumes:
  subspace_api_data:

networks:
  proxy:
    external: true
  api:
    external: true
    