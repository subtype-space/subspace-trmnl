name: Docker Image CI

on:
  push:
    tags:
      - 'v*'     # stable releases
      - 'rc-*'   # release candidates

permissions:
  contents: write
  pull-requests: read
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # ensures full history for changelog generation

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            docker buildx build \
              -t ghcr.io/${{ github.repository_owner }}/subspace-trmnl:${{ github.ref_name }} \
              -t ghcr.io/${{ github.repository_owner }}/subspace-trmnl:latest \
              --push .
          else
            docker buildx build \
              -t ghcr.io/${{ github.repository_owner }}/subspace-trmnl:${{ github.ref_name }}-rc \
              --push .
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ startsWith(github.ref_name, 'rc-') }}