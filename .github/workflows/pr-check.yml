name: PR Checks

on:
  pull_request:
    branches: [dev, v1, main]
  push:
    branches: [dev, v1]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check package.json/package-lock.json version match
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          LOCK_VERSION=$(node -p "require('./package-lock.json').version")
          if [ "$PKG_VERSION" != "$LOCK_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match package-lock.json version ($LOCK_VERSION). Run 'npm install' (or 'npm version') to sync them."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
